# HTTP site used until Let's Encrypt files are mounted.
# Production domain: vownests.com (and www).

server {
    listen 80 default_server;
    server_name __DOMAIN__ www.__DOMAIN__ localhost 127.0.0.1;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/locations.conf;
}
